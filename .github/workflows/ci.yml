# Continuous integration: cluster-free checks plus containerized Spark tests.
# Two jobs run on every push/PR (no cluster, no cloud, no secrets).
name: ci
on:
  push:
  pull_request:

# Pinned tool versions so CI is reproducible.
env:
  TERRAFORM_VERSION: 1.16.5
  HELM_VERSION: v4.3.0
  KUBECONFORM_VERSION: v0.8.0
  K8S_VERSION: v1.33.1

jobs:
  # Job 1: lint, unit tests, and static validation of infrastructure code.
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Only the *light* deps are installed: the cluster-free tests do not need
      # PySpark/GX/Trino (those run elsewhere or are optional imports).
      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.0 pytest==9.1.1 pyyaml==6.0.3

      - name: Ruff
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      # Spark tests skip on non-Linux runners here; they run in the job below.
      - name: Pytest (cluster-free; Spark tests run in the job below)
        run: pytest -q

      - name: Terraform fmt/validate
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.5
      - run: terraform -chdir=infra/terraform init -backend=false
      - run: terraform -chdir=infra/terraform fmt -check
      - run: terraform -chdir=infra/terraform validate

      - name: Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.0
      - run: helm repo add argo https://argoproj.github.io/argo-helm
      - run: helm repo add trino https://trinodb.github.io/charts
      - run: helm dependency update infra/helm/trino
      - name: Helm lint
        run: |
          for chart in minio postgres lakekeeper spark-jobs trino; do
            helm lint infra/helm/$chart
          done
          # argocd is upstream chart + values file: render check only
          helm template argocd argo/argo-cd --version 10.10.3 -n argocd \
            -f infra/helm/argocd/values.yaml > /dev/null

      # Render every chart to a file so kubeconform can validate the manifests.
      - name: Render charts
        run: |
          mkdir -p /tmp/rendered
          helm template lakehouse-minio infra/helm/minio > /tmp/rendered/minio.yaml
          helm template lakehouse-postgres infra/helm/postgres > /tmp/rendered/postgres.yaml
          helm template lakehouse-lakekeeper infra/helm/lakekeeper > /tmp/rendered/lakekeeper.yaml
          helm template spark-jobs infra/helm/spark-jobs --set month=2024-01 > /tmp/rendered/spark-jobs.yaml
          helm template lakehouse-trino infra/helm/trino > /tmp/rendered/trino.yaml

      # kubeconform validates manifests against the real Kubernetes API schema.
      # -ignore-missing-schemas skips CRDs it does not know (e.g. Argo CD).
      - name: kubeconform
        run: |
          curl -fSL -o /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -kubernetes-version 1.33.1 -ignore-missing-schemas \
            /tmp/rendered/minio.yaml /tmp/rendered/postgres.yaml \
            /tmp/rendered/lakekeeper.yaml /tmp/rendered/spark-jobs.yaml \
            /tmp/rendered/trino.yaml

  # Job 2: run the PySpark tests in the official Linux image. The host Windows
  # runner cannot run them, and this needs no Kubernetes cluster.
  spark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Spark transform tests (official Linux image, no cluster)
        run: |
          docker run --rm --user root -e HOME=/tmp -v "$PWD":/work -w /work \
            -e SPARK_LOCAL_IP=127.0.0.1 \
            apache/spark:3.5.9 bash /work/scripts/ci-spark-tests.sh
