# Data-plane Argo CD Applications: one per Helm chart, each owning a namespace.
# Applied by the root app (app-of-apps). `automated.selfHeal/prune` means Argo
# would revert manual cluster changes and delete removed resources once a Git
# remote is reachable (see D10; up.ps1 applies these charts meanwhile).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lakehouse-minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mazhine/nyc-taxi-lakehouse.git
    targetRevision: HEAD
    path: infra/helm/minio
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse
  syncPolicy:
    automated: {prune: true, selfHeal: true}
---
