# Argo CD 3.5.5 via chart argo/argo-cd 10.10.3 — single-node sizing.
# Explicit requests/limits everywhere; single replicas (no HA on 1 node).
#
# Why Argo CD at all? It gives a GitOps control plane so the cluster state can
# be reconciled from Git. This project has no remote in the demo environment
# (D10), so scripts/up.ps1 applies the same charts directly; the Application
# manifests in ../apps document the intended GitOps layout.
global: {}
controller:
  replicas: 1
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}
server:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
repoServer:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}
applicationSet:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
redis:
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 250m, memory: 256Mi}
