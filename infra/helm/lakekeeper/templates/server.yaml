# Lakekeeper server (the Iceberg REST catalog API) + its NodePort Service.
# Reads/writes catalog metadata in Postgres; points Iceberg clients at MinIO.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lakekeeper
  namespace: lakehouse
  labels:
    app: lakekeeper
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lakekeeper
  template:
    metadata:
      labels:
        app: lakekeeper
    spec:
      containers:
        - name: lakekeeper
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          args: ["serve"]
          ports:
            - {name: http, containerPort: 8181}
          env:
            - name: LAKEKEEPER__PG_DATABASE_URL_READ
              value: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
            - name: LAKEKEEPER__PG_DATABASE_URL_WRITE
              value: "postgresql://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ .Values.postgres.host }}:{{ .Values.postgres.port }}/{{ .Values.postgres.database }}"
            - name: LAKEKEEPER__PG_ENCRYPTION_KEY
              value: {{ .Values.pgEncryptionKey | quote }}
            - name: RUST_LOG
              value: info
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: lakekeeper
  namespace: lakehouse
spec:
  type: NodePort
  selector:
    app: lakekeeper
  ports:
    - {name: http, port: 8181, targetPort: http, nodePort: {{ .Values.nodePort }}}
