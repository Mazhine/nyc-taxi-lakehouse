# MinIO single-node Deployment: serves the S3 API (9000) and console (9001).
# Data is persisted on the minio-data PVC; credentials come from the Secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: lakehouse
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}@{{ .Values.image.digest }}"
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - {name: api, containerPort: 9000}
            - {name: console, containerPort: 9001}
          env:
            - name: MINIO_ROOT_USER
              valueFrom: {secretKeyRef: {name: minio-creds, key: root-user}}
            - name: MINIO_ROOT_PASSWORD
              valueFrom: {secretKeyRef: {name: minio-creds, key: root-password}}
          resources: {{ .Values.resources | toYaml | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
          livenessProbe:
            httpGet: {path: /minio/health/live, port: api}
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: api}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
