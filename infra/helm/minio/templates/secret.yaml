# Demo credentials Secret consumed by the MinIO Deployment and the bucket Job.
# Values come from values.yaml (demo-local) and can be overridden with --set.
apiVersion: v1
kind: Secret
metadata:
  name: minio-creds
  namespace: lakehouse
type: Opaque
stringData:
  root-user: {{ .Values.rootUser | quote }}
  root-password: {{ .Values.rootPassword | quote }}
