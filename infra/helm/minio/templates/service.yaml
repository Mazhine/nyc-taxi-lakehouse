apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: lakehouse
spec:
  type: NodePort
  selector:
    app: minio
  ports:
    - {name: api, port: 9000, targetPort: api, nodePort: {{ .Values.nodePorts.api }}}
    - {name: console, port: 9001, targetPort: console, nodePort: {{ .Values.nodePorts.console }}}
