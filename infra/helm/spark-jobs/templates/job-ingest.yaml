# One Job per source file (values.selectFile). Applied once per month by
# scripts/run-ingest.ps1 with --set month=YYYY-MM (helm template | kubectl apply
# pattern keeps history clean; the Job name includes the month).
apiVersion: batch/v1
kind: Job
metadata:
  name: spark-ingest-{{ .Values.month | default "manual" }}
  namespace: lakehouse
spec:
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: spark
      restartPolicy: OnFailure
      containers:
        - name: submitter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command:
            - /bin/bash
            - -c
            - |
              set -eux
              # Client-mode driver must be reachable by executors: no DNS entry
              # exists for this pod, so advertise its IP (not its hostname).
              DRIVER_IP="$(hostname -i | awk '{print $1}')"
              /opt/spark/bin/spark-submit \
                --master k8s://https://kubernetes.default.svc \
                --deploy-mode client \
                --name ingest-{{ .Values.month | default "manual" }} \
                --conf spark.kubernetes.namespace=lakehouse \
                --conf spark.kubernetes.container.image="{{ .Values.image.repository }}:{{ .Values.image.tag }}" \
                --conf spark.kubernetes.authenticate.driver.serviceAccountName=spark \
                --conf spark.driver.host="$DRIVER_IP" \
                --conf spark.driver.bindAddress=0.0.0.0 \
                --conf spark.driver.port=22222 \
                --conf spark.driver.blockManager.port=22223 \
                --conf spark.driver.memory={{ .Values.driverMemory }} \
                --conf "spark.driver.extraJavaOptions=-XX:+UseParallelGC" \
                --conf "spark.executor.extraJavaOptions=-XX:+UseParallelGC" \
                --conf spark.executor.instances={{ .Values.executorInstances }} \
                --conf spark.executor.memory={{ .Values.executorMemory }} \
                --conf spark.executor.cores={{ .Values.executorCores }} \
                --conf spark.executorEnv.PYTHONPATH=/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip \
                --conf spark.executorEnv.PYSPARK_PYTHON=python3 \
                --conf spark.sql.extensions=org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions \
                --conf spark.sql.iceberg.vectorization.enabled=false \
                local:///opt/spark/jobs/src/ingestion/ingest.py \
                --input s3a://lakehouse/raw/yellow_tripdata_{{ .Values.month | default "2024-01" }}.parquet \
                --table {{ .Values.table }} \
                --contract {{ .Values.contractPath }} \
                --source-file yellow_tripdata_{{ .Values.month | default "2024-01" }} \
                --quarantine-path {{ .Values.quarantinePath }} \
                --catalog-uri {{ .Values.catalogUri }} \
                --warehouse {{ .Values.warehouse }} \
                --s3-endpoint {{ .Values.s3Endpoint }} \
                --master k8s://https://kubernetes.default.svc
          env:
            - {name: S3_ACCESS_KEY, value: {{ .Values.s3AccessKey | quote }}}
            - {name: S3_SECRET_KEY, value: {{ .Values.s3SecretKey | quote }}}
            - {name: PYTHONPATH, value: "/opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip"}
          resources: {{ .Values.runnerResources | toYaml | nindent 12 }}
