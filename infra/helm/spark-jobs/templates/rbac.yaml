# RBAC for spark-submit --master k8s (driver + executors as pods in ns lakehouse).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: lakehouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark
  namespace: lakehouse
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims"]
    verbs: ["create", "delete", "deletecollection", "get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark
  namespace: lakehouse
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: lakehouse
roleRef:
  kind: Role
  name: spark
  apiGroup: rbac.authorization.k8s.io
