# Values for the official trino/trino chart 1.44.0 (app 483).
# Single-node sizing: 1 coordinator + 1 worker, explicit limits.
trino:
  image:
    tag: "483"
  server:
    workers: 1
  service:
    type: NodePort
    nodePort: 30080
  coordinator:
    jvm:
      maxHeapSize: "2G"
    resources:
      requests: {cpu: 500m, memory: 2Gi}
      limits: {cpu: "2", memory: 3Gi}
  worker:
    jvm:
      maxHeapSize: "3G"
    resources:
      requests: {cpu: "1", memory: 3Gi}
      limits: {cpu: "2", memory: 4Gi}
  catalogs:
    lakehouse: |-
      connector.name=iceberg
      iceberg.catalog.type=rest
      iceberg.rest-catalog.uri=http://lakekeeper.lakehouse.svc.cluster.local:8181/catalog
      iceberg.rest-catalog.warehouse=warehouse
      iceberg.expire-snapshots.min-retention=1h
      iceberg.remove-orphan-files.min-retention=1h
      fs.s3.enabled=true
      s3.endpoint=http://minio.lakehouse.svc.cluster.local:9000
      s3.region=us-east-1
      s3.path-style-access=true
      s3.aws-access-key=minioadmin
      s3.aws-secret-key=minioadmin-local-demo-only
