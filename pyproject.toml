[project]
name = "lakehouse-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pyspark==3.5.9",
  "pyarrow==18.1.0",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "ruff==0.9.9"]
quality = ["great-expectations==1.24.0"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
